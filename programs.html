<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Courses — TCM One</title>
  <script>
    var base = (window.location.pathname.indexOf('/tcm') === 0) ? '/tcm' : '';
    window.location.replace(base + '/courses');
  </script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 40px; text-align: center;">
  <p>Redirecting to courses... If not redirected, <a id="redirectLink" href="/courses">click here</a>.</p>
  <script>
    var base = (window.location.pathname.indexOf('/tcm') === 0) ? '/tcm' : '';
    var el = document.getElementById('redirectLink');
    if (el) el.href = base + '/courses';
  </script>
</body>
</html>
