<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Workshop Details — TCM One</title>
  <script>
    var base = (window.location.pathname.indexOf('/tcm') === 0) ? '/tcm' : '';
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug') || params.get('workshop') || params.get('event');
    var target = base + (slug ? ('/workshops/' + encodeURIComponent(slug)) : '/workshops');
    window.location.replace(target);
  </script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 40px; text-align: center;">
  <p>Redirecting to workshop details... If not redirected, <a id="redirectLink" href="/workshops">click here</a>.</p>
  <script>
    var base = (window.location.pathname.indexOf('/tcm') === 0) ? '/tcm' : '';
    var el = document.getElementById('redirectLink');
    if (el) el.href = base + '/workshops';
  </script>
</body>
</html>
