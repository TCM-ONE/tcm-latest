<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" fill="none">
  <!-- Precision Editorial Process Grid -->
  <g stroke="currentColor" stroke-width="1" opacity="0.2">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800" stroke-dasharray="1 7" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400" stroke-dasharray="1 7" />
    <!-- Connector curves -->
    <path d="M 100 200 C 200 120, 300 280, 400 200 S 600 280, 700 200" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="100" cy="200" r="4" fill="currentColor" />
    <circle cx="300" cy="200" r="4" fill="currentColor" />
    <circle cx="500" cy="200" r="4" fill="currentColor" />
    <circle cx="700" cy="200" r="4" fill="currentColor" />
  </g>
</svg>
