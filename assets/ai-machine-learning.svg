<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <radialGradient id="aiGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="250" fill="url(#aiGlow)"/>

  <!-- Neural Network Connections -->
  <!-- Layer 1 to Layer 2 -->
  <line x1="100" y1="65" x2="170" y2="50" stroke="url(#lineGrad1)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="65" x2="170" y2="105" stroke="url(#lineGrad1)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="110" x2="170" y2="50" stroke="url(#lineGrad1)" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="110" x2="170" y2="105" stroke="url(#lineGrad1)" stroke-width="2.5" opacity="0.8"/>
  <line x1="100" y1="110" x2="170" y2="160" stroke="url(#lineGrad1)" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="155" x2="170" y2="105" stroke="url(#lineGrad1)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="155" x2="170" y2="160" stroke="url(#lineGrad1)" stroke-width="2" opacity="0.6"/>

  <!-- Layer 2 to Layer 3 -->
  <line x1="170" y1="50" x2="240" y2="70" stroke="url(#lineGrad2)" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="50" x2="240" y2="135" stroke="url(#lineGrad2)" stroke-width="2" opacity="0.4"/>
  <line x1="170" y1="105" x2="240" y2="70" stroke="url(#lineGrad2)" stroke-width="2.5" opacity="0.8"/>
  <line x1="170" y1="105" x2="240" y2="135" stroke="url(#lineGrad2)" stroke-width="2.5" opacity="0.8"/>
  <line x1="170" y1="160" x2="240" y2="70" stroke="url(#lineGrad2)" stroke-width="2" opacity="0.4"/>
  <line x1="170" y1="160" x2="240" y2="135" stroke="url(#lineGrad2)" stroke-width="2" opacity="0.6"/>

  <!-- Layer 3 to Layer 4 (Output) -->
  <line x1="240" y1="70" x2="305" y2="105" stroke="#06b6d4" stroke-width="2.5" opacity="0.8"/>
  <line x1="240" y1="135" x2="305" y2="105" stroke="#ec4899" stroke-width="2.5" opacity="0.8"/>

  <!-- Input Nodes -->
  <circle cx="100" cy="65" r="9" fill="#0b0f19" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="100" cy="110" r="9" fill="#0b0f19" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="100" cy="155" r="9" fill="#0b0f19" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="100" cy="110" r="4" fill="#a78bfa"/>

  <!-- Hidden Layer 1 Nodes -->
  <circle cx="170" cy="50" r="11" fill="#0b0f19" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="170" cy="105" r="13" fill="#1e1b4b" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="170" cy="160" r="11" fill="#0b0f19" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="170" cy="105" r="5" fill="#22d3ee"/>

  <!-- Hidden Layer 2 Nodes -->
  <circle cx="240" cy="70" r="11" fill="#0b0f19" stroke="#ec4899" stroke-width="2.5"/>
  <circle cx="240" cy="135" r="11" fill="#0b0f19" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="240" cy="70" r="4.5" fill="#f472b6"/>

  <!-- Output Node (Brain / AI Hub) -->
  <circle cx="305" cy="105" r="16" fill="#180b2c" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="305" cy="105" r="7" fill="#ec4899"/>

  <!-- Pulsing rings -->
  <circle cx="305" cy="105" r="23" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- Tech label -->
  <rect x="70" y="200" width="260" height="28" rx="6" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
  <text x="200" y="219" fill="#f5f3ff" font-family="'Segoe UI', Roboto, monospace, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">AI &amp; MACHINE LEARNING</text>
</svg>
